[project]
name = "lexflow"
version = "0.1.0"
description = "Single-application law firm case management prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.19",
  "psycopg[binary]==3.3.8",
  "python-dotenv==1.2.4",
  "gunicorn==23.0.0; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["ruff==0.17.4", "playwright==1.65.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

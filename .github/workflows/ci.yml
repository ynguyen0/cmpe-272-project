name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_DB: lexflow
          POSTGRES_USER: lexflow
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexflow -d lexflow"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: lexflow
      POSTGRES_USER: lexflow
      POSTGRES_PASSWORD: ci-ephemeral-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_TEST_DB: test_lexflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned tooling and dependencies
        run: |
          python -m pip install uv==0.12.15
          uv sync --locked
          uv run --locked playwright install --with-deps chromium
      - name: Generate ephemeral signing key
        run: python -c 'import secrets; print("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(64))' >> "$GITHUB_ENV"
      - name: Check migrations, style, Django tests, and browser workflows
        run: sh scripts/check.sh
